# ── v11 旋转鲁棒性增强训练 ──────────────────────────
# 分阶段训练：先大alpha+大旋转，再逐渐调小到目标值
version: "v11_rotation_curriculum"
description: "v11旋转鲁棒性增强 - 课程学习 (0-10°)"

# ── 数据集 ──────────────────────────────────────────
train_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/train"
val_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/val"
train_length: 0    # 使用全部数据
val_length: 0

# ── 模型 ──────────────────────────────────────────
resume: "/mnt/lpl/fftmask/output/finetune_v11_v3/20260724_095433/models/best_cb_decoder_v11.pth"
output_dir: "/mnt/lpl/fftmask/output/finetune_v11_rotation"
block_size: 512
num_bits: 60
r_watermark: [12, 25]
bitsf: [15, 45]
ring_width: 5

# ── 旋转参考环 ──────────────────────────────────────
r_rotation: 18
rotation_patches: 36

# ── 噪声策略: pair ──────────────────────────────
noise_schedule:
  - [999, 0.016, "pair"]

# ── 旋转角度课程学习 ──────────────────────────────
# 格式: [结束epoch(不含), max_rotation]
# 阶段1: 大旋转±10° (学习粗粒度旋转不变性)
# 阶段2: 中旋转±8° (细化)
# 阶段3: 目标旋转±5° (精调)
rotation_schedule:
  - [15, 10.0]
  - [30, 8.0]
  - [999, 5.0]

# ── 训练参数 ──────────────────────────────────────
batch_size: 64
epochs: 50
lr: 0.00003
device: "0,1"

# ── 模式 ──────────────────────────────────────────
mode: "decoder_only"

# ── 损失权重 ──────────────────────────────────────
lambda_bit: 15.0
lambda_shape: 0.04
