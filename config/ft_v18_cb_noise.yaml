# v18 Cb通道镂空 - 新噪声微调 (physical_moire + wechat×4)
train_dir: "/data/xsj/dataset/coco/train"
val_dir: "/data/xsj/dataset/coco/val"
output_dir: "output/v18_cb_ft_noise"

finetune:
  weight_path: "output/v18_hollow_pair/best_model.pth"
  epochs: 10
  lr: 0.00002

block_size: 512
num_bits: 60
bits_per_ring: [15, 45]
ring_positions: [12, 25]
angle_bins: 180
M_w: 255
M_b: 0
hollow_ratio: 0.3
alpha: 0.0191

noise_config:
  train_noise:
    - type: "pair"
      weight: 1.0
  val_noise: "none"

wechat_downsample_factor: 4
max_rotation: 0
max_shift: 0.5

batch_size: 32
lambda_bit: 15.0
train_length: 10240
val_length: 1024
save_every: 5
num_workers: 0
