# ── v11 继续训练 - 固定三重噪声 ──────────────────────────
# 从 v11 best 继续训练，固定噪声顺序: tile_crop → pimog → wechat
version: "v11_fixed_triple"
description: "v11继续训练 - 固定三重噪声 (tile_crop → pimog → wechat)"

# ── 数据集 ──────────────────────────────────────────
train_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/train"
val_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/val"
train_length: 5120
val_length: 1024

# ── 模型 ──────────────────────────────────────────
resume: "/mnt/lpl/fftmask/output/finetune_v11/20260723_121008/models/best_cb_decoder_v11.pth"
output_dir: "/mnt/lpl/fftmask/output/finetune_v11"
block_size: 512
num_bits: 60
r_watermark: [12, 25]
bitsf: [15, 45]
ring_width: 5

# ── 旋转参考环 ──────────────────────────────────────
r_rotation: 18
rotation_patches: 36

# ── tile_crop噪声中的旋转范围 ──────────────────────
max_rotation: 5.0

# ── 训练参数 ──────────────────────────────────────
batch_size: 64
epochs: 30
lr: 0.00002  # 更小的学习率
device: "0,1"

# ── 噪声策略: 固定三重噪声 ──────────────────────
noise_schedule:
  - [999, 0.016, "fixed_triple"]

# ── 模式 ──────────────────────────────────────────
mode: "decoder_only"

# ── 损失权重 ──────────────────────────────────────
lambda_bit: 15.0
lambda_shape: 0.04
