# ── v11 继续训练 v3 ──────────────────────────────────────────
# 从 v11_v2 best 继续训练，再跑 50 epochs
version: "v11_v3"
description: "v11继续训练 - 从v2 best继续"

# ── 数据集 ──────────────────────────────────────────
train_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/train"
val_dir: "/mnt/xsj2023/Datasets/COCO/coco_minator_dataset/val"
train_length: 0    # 0 = 使用全部数据 (15000张)
val_length: 0      # 0 = 使用全部验证数据

# ── 模型 ──────────────────────────────────────────
resume: "/mnt/lpl/fftmask/output/finetune_v11_v2/20260723_171848/models/best_cb_decoder_v11.pth"
output_dir: "/mnt/lpl/fftmask/output/finetune_v11_v3"
block_size: 512
num_bits: 60
r_watermark: [12, 25]
bitsf: [15, 45]
ring_width: 5

# ── 旋转参考环 ──────────────────────────────────────
r_rotation: 18
rotation_patches: 36

# ── tile_crop噪声中的旋转范围 ──────────────────────
max_rotation: 5.0

# ── 训练参数 ──────────────────────────────────────
batch_size: 64
epochs: 50
lr: 0.00002   # 更小的学习率，精细调优
device: "0,1"

# ── 噪声策略: pair ──────────────────────────────
noise_schedule:
  - [999, 0.016, "pair"]

# ── 模式 ──────────────────────────────────────────
mode: "decoder_only"

# ── 损失权重 ──────────────────────────────────────
lambda_bit: 15.0
lambda_shape: 0.04
