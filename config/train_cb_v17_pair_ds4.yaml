# v17 Cb通道 - pair噪声微调 (下采样512→128)
train_dir: "/data/xsj/dataset/coco/train"
val_dir: "/data/xsj/dataset/coco/val"
output_dir: "output/v17_pair_ds4"

# 微调权重（从已训练的pair模型继续）
finetune:
  weight_path: "output/v17_pair/best_model.pth"
  epochs: 100
  lr: 0.00002

# 模型参数（与v18一致）
block_size: 512
num_bits: 60
bits_per_ring: [15, 45]
ring_positions: [12, 25]
angle_bins: 180

# 嵌入参数（无镂空，纯二值模板）
alpha: 0.0191

# 噪声配置 - 纯pair噪声
noise_config:
  train_noise:
    - type: "pair"
      weight: 1.0
  val_noise: "none"

# 微信压缩下采样倍数 (2=512→256, 4=512→128)
wechat_downsample_factor: 4

# 数据增强
max_rotation: 0
max_shift: 0.5

# 训练参数
batch_size: 32
lambda_bit: 15.0
train_length: 10240
val_length: 1024

# 保存配置
save_every: 10
